services:
  app:
    build: .
    container_name: bot_Hitech
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
    env_file:
      - credentials.env
    command: ["python", "main.py"]

  db:
    image: postgres
    container_name: db_Bot_HiTech
    environment:
      POSTGRES_USER: "HiTech"
      POSTGRES_DB: "DB_BOT_HiTECH"
      POSTGRES_PASSWORD: "HiTechBot2025"
      POSTGRES_HOST: "db"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U HiTech -d DB_BOT_HiTECH"]
      interval: 5s
      retries: 5
      timeout: 5s
      start_period: 10s

volumes:
  pgdata:
